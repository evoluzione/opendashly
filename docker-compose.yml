services:

  clickhouse:
    container_name: clickhouse
    build:
      context: ./docker/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      # Force the probe through the memory tracker (max_untracked_memory=0): a
      # bare SELECT 1 fits in untracked memory and stays green even when the
      # server rejects every real query with code 241 (tracked total > cap).
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD:-otelpass}", "--max_untracked_memory", "0", "--max_threads", "1", "--query", "SELECT count() FROM numbers(65536)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    labels:
      - autoheal=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    container_name: otel-collector
    build:
      context: ./docker/otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "0:0"
    volumes:
      - otelcol_queue_data:/var/lib/otelcol
    healthcheck:
      test: ["CMD", "/otel-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - clickhouse
      - otel-collector
    labels:
      - autoheal=true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Docker restart policies do not react to healthcheck failures. autoheal
  # restarts containers labeled autoheal=true when they become unhealthy.
  autoheal:
    container_name: autoheal
    image: willfarrell/autoheal:latest
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
      
  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clickhouse_data:
  otelcol_queue_data:
