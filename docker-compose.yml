services:

  clickhouse:
    container_name: clickhouse
    build:
      context: ./docker/clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD:-otelpass}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  otel-collector:
    container_name: otel-collector
    build:
      context: ./docker/otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
      - OTEL_FILE_STORAGE_DIR=${OTEL_FILE_STORAGE_DIR:-/var/lib/otelcol/queue}
      - OTEL_MEMORY_LIMITER_CHECK_INTERVAL=${OTEL_MEMORY_LIMITER_CHECK_INTERVAL:-1s}
      - OTEL_MEMORY_LIMIT_MIB=${OTEL_MEMORY_LIMIT_MIB:-350}
      - OTEL_MEMORY_SPIKE_LIMIT_MIB=${OTEL_MEMORY_SPIKE_LIMIT_MIB:-50}
      - OTEL_BATCH_SEND_SIZE=${OTEL_BATCH_SEND_SIZE:-500}
      - OTEL_BATCH_TIMEOUT=${OTEL_BATCH_TIMEOUT:-2s}
      - OTEL_EXPORTER_TIMEOUT=${OTEL_EXPORTER_TIMEOUT:-5s}
      - OTEL_SENDING_QUEUE_SIZE=${OTEL_SENDING_QUEUE_SIZE:-5000}
      - OTEL_SENDING_QUEUE_CONSUMERS=${OTEL_SENDING_QUEUE_CONSUMERS:-1}
      - OTEL_RETRY_INITIAL_INTERVAL=${OTEL_RETRY_INITIAL_INTERVAL:-1s}
      - OTEL_RETRY_MAX_INTERVAL=${OTEL_RETRY_MAX_INTERVAL:-30s}
      - OTEL_RETRY_MAX_ELAPSED_TIME=${OTEL_RETRY_MAX_ELAPSED_TIME:-0}
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "0:0"
    volumes:
      - otelcol_queue_data:/var/lib/otelcol
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    container_name: backend
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-otelpass}
      - CLICKHOUSE_MAX_MEMORY_MIB=${CLICKHOUSE_MAX_MEMORY_MIB:-150}
      - CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY_MIB=${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_GROUP_BY_MIB:-32}
      - CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT_MIB=${CLICKHOUSE_MAX_BYTES_BEFORE_EXTERNAL_SORT_MIB:-32}
      - CLICKHOUSE_MAX_TEMP_DATA_ON_DISK_MIB=${CLICKHOUSE_MAX_TEMP_DATA_ON_DISK_MIB:-1024}
      - CLICKHOUSE_MAX_EXECUTION_TIME_SECONDS=${CLICKHOUSE_MAX_EXECUTION_TIME_SECONDS:-8}
      - CLICKHOUSE_MAX_OPEN_CONNS=${CLICKHOUSE_MAX_OPEN_CONNS:-5}
      - CLICKHOUSE_MAX_IDLE_CONNS=${CLICKHOUSE_MAX_IDLE_CONNS:-3}
      - CLICKHOUSE_DIAL_TIMEOUT_SECONDS=${CLICKHOUSE_DIAL_TIMEOUT_SECONDS:-5}
      - CLICKHOUSE_READ_TIMEOUT_SECONDS=${CLICKHOUSE_READ_TIMEOUT_SECONDS:-10}
      - DASHBOARD_FRESH_CACHE_TTL_SECONDS=${DASHBOARD_FRESH_CACHE_TTL_SECONDS:-30}
      - DASHBOARD_STALE_CACHE_TTL_SECONDS=${DASHBOARD_STALE_CACHE_TTL_SECONDS:-900}
      - DASHBOARD_REQUEST_TIMEOUT_SECONDS=${DASHBOARD_REQUEST_TIMEOUT_SECONDS:-15}
      - DASHBOARD_QUERY_PARALLELISM=${DASHBOARD_QUERY_PARALLELISM:-1}
      - DASHBOARD_HALVE_ON_OOM=${DASHBOARD_HALVE_ON_OOM:-true}
      - COLLECTOR_HEALTH_URL=http://otel-collector:13133
      - API_LISTEN_ADDR=:8080
      - AUTH_MODE=jwt
      - AUTH_SECRET=${AUTH_SECRET:-dev-secret}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      - VITE_DEBUG_QUERY=${VITE_DEBUG_QUERY:-false}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-1440}
      - SERVICE_LIST_TIMEOUT_SECONDS=${SERVICE_LIST_TIMEOUT_SECONDS:-15}
      - RETENTION_COUNT_PRECHECK_ENABLED=${RETENTION_COUNT_PRECHECK_ENABLED:-false}
    depends_on:
      - clickhouse
      - otel-collector
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
      
  frontend:
    container_name: frontend
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/static:/app/static
    depends_on:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  clickhouse_data:
  otelcol_queue_data:
