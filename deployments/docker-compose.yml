services:

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml
    depends_on:
      - clickhouse

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - API_LISTEN_ADDR=:8080
      - AUTH_MODE=header
    depends_on:
      - clickhouse
      - otel-collector
      
  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://backend:8080
    depends_on:
      - backend
