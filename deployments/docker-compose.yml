services:

  clickhouse:
    image: clickhouse/clickhouse-server:24
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.99.0
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ./collector-config.yaml:/etc/otelcol/config.yaml
    depends_on:
      clickhouse:
        condition: service_healthy

  backend:
    build:
      context: ../backend
    ports:
      - "8080:8080"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - API_LISTEN_ADDR=:8080
      - AUTH_MODE=header
    depends_on:
      - clickhouse
      - otel-collector
      
  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8080
    depends_on:
      - backend

volumes:
  clickhouse_data:
