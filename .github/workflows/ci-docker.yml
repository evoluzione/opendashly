name: 🚀 CI/CD Pipeline

on:
  push:
    tags:
      - '[0-9]*'
    branches:
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: ci-docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: 🐹 Set up Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum
      - name: 🏃 Run Backend Tests
        working-directory: backend
        run: go test ./...

  frontend-test:
    name: 🧪 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: 🟢 Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: ✨ Run Frontend Tests
        working-directory: frontend
        run: npm test

  docker:
    name: 🐳 Build & Push (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: app
            image: ghcr.io/evoluzione/opendashly
            context: .
            file: Dockerfile
          - name: clickhouse
            image: ghcr.io/evoluzione/opendashly-clickhouse
            context: ./docker/clickhouse
            file: ./docker/clickhouse/Dockerfile
          - name: otel-collector
            image: ghcr.io/evoluzione/opendashly-otel-collector
            context: ./docker/otel-collector
            file: ./docker/otel-collector/Dockerfile
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REGISTRY_HUB_SECRET }}
      - name: 🏷️ Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - name: 🚀 Build and Push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
