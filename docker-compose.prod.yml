services:
  app:
    image: ghcr.io/evoluzione/opendashly:latest
    container_name: opendashly-app
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      - AUTH_SECRET=${AUTH_SECRET:?set AUTH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS}
    depends_on:
      clickhouse:
        condition: service_healthy
    # Probe the backend API on :8080 directly. A bare process-up check is not
    # enough: the backend can die (or wedge) while the frontend on :5173 keeps
    # the container "Up".
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  clickhouse:
    image: ghcr.io/evoluzione/opendashly-clickhouse:latest
    container_name: opendashly-clickhouse
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      # Force the probe through the memory tracker (max_untracked_memory=0): a
      # bare SELECT 1 fits in untracked memory and stays green even when the
      # server rejects every real query with code 241 (tracked total > cap).
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}", "--max_untracked_memory", "0", "--max_threads", "1", "--query", "SELECT count() FROM numbers(65536)"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    labels:
      - autoheal=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/evoluzione/opendashly-otel-collector:latest
    container_name: opendashly-otel-collector
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "0:0"
    volumes:
      - otelcol_queue_data:/var/lib/otelcol
    healthcheck:
      test: ["CMD", "/otel-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    labels:
      - autoheal=true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  # Docker restart policies do not react to healthcheck failures. autoheal
  # restarts containers labeled autoheal=true when they become unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: opendashly-autoheal
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  clickhouse_data:
  otelcol_queue_data:
