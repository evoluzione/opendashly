services:
  app:
    image: ghcr.io/evoluzione/opendashly:latest
    container_name: opendashly-app
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_MAX_MEMORY_MIB=${CLICKHOUSE_MAX_MEMORY_MIB:-256}
      - CLICKHOUSE_MAX_EXECUTION_TIME_SECONDS=${CLICKHOUSE_MAX_EXECUTION_TIME_SECONDS:-15}
      - CLICKHOUSE_MAX_OPEN_CONNS=${CLICKHOUSE_MAX_OPEN_CONNS:-8}
      - CLICKHOUSE_MAX_IDLE_CONNS=${CLICKHOUSE_MAX_IDLE_CONNS:-4}
      - CLICKHOUSE_DIAL_TIMEOUT_SECONDS=${CLICKHOUSE_DIAL_TIMEOUT_SECONDS:-5}
      - CLICKHOUSE_READ_TIMEOUT_SECONDS=${CLICKHOUSE_READ_TIMEOUT_SECONDS:-20}
      - COLLECTOR_HEALTH_URL=http://otel-collector:13133
      - AUTH_MODE=jwt
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CLEANUP_INTERVAL_MINUTES=${CLEANUP_INTERVAL_MINUTES:-360}
      - SERVICE_LIST_TIMEOUT_SECONDS=${SERVICE_LIST_TIMEOUT_SECONDS:-15}
      - RETENTION_COUNT_PRECHECK_ENABLED=${RETENTION_COUNT_PRECHECK_ENABLED:-false}
    depends_on:
      clickhouse:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-768m}
    memswap_limit: ${APP_MEMSWAP_LIMIT:-768m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  clickhouse:
    image: ghcr.io/evoluzione/opendashly-clickhouse:latest
    container_name: opendashly-clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1536m}
    memswap_limit: ${CLICKHOUSE_MEMSWAP_LIMIT:-1536m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/evoluzione/opendashly-otel-collector:latest
    container_name: opendashly-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - OTEL_MEMORY_LIMITER_CHECK_INTERVAL=${OTEL_MEMORY_LIMITER_CHECK_INTERVAL:-1s}
      - OTEL_MEMORY_LIMIT_MIB=${OTEL_MEMORY_LIMIT_MIB:-300}
      - OTEL_MEMORY_SPIKE_LIMIT_MIB=${OTEL_MEMORY_SPIKE_LIMIT_MIB:-60}
      - OTEL_BATCH_SEND_SIZE=${OTEL_BATCH_SEND_SIZE:-2000}
      - OTEL_BATCH_TIMEOUT=${OTEL_BATCH_TIMEOUT:-2s}
      - OTEL_EXPORTER_TIMEOUT=${OTEL_EXPORTER_TIMEOUT:-10s}
      - OTEL_SENDING_QUEUE_SIZE=${OTEL_SENDING_QUEUE_SIZE:-2000}
      - OTEL_SENDING_QUEUE_CONSUMERS=${OTEL_SENDING_QUEUE_CONSUMERS:-4}
      - OTEL_RETRY_INITIAL_INTERVAL=${OTEL_RETRY_INITIAL_INTERVAL:-1s}
      - OTEL_RETRY_MAX_INTERVAL=${OTEL_RETRY_MAX_INTERVAL:-30s}
      - OTEL_RETRY_MAX_ELAPSED_TIME=${OTEL_RETRY_MAX_ELAPSED_TIME:-600s}
    depends_on:
      clickhouse:
        condition: service_healthy
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-512m}
    memswap_limit: ${OTEL_COLLECTOR_MEMSWAP_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  clickhouse_data:
