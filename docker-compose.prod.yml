services:
  app:
    image: ghcr.io/evoluzione/opendashly:latest
    container_name: opendashly-app
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - AUTH_MODE=jwt
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CLEANUP_INTERVAL_MINUTES=1440
    depends_on:
      clickhouse:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  clickhouse:
    image: ghcr.io/evoluzione/opendashly-clickhouse:latest
    container_name: opendashly-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/evoluzione/opendashly-otel-collector:latest
    container_name: opendashly-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
    depends_on:
      clickhouse:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  clickhouse_data:
