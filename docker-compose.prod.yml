services:
  app:
    image: ghcr.io/evoluzione/opendashly:latest
    container_name: opendashly-app
    ports:
      - "8080:8080"
      - "5173:5173"
    environment:
      - CLICKHOUSE_ADDR=clickhouse:9000
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - MACHINE_PROFILE=${MACHINE_PROFILE:-}
      - MACHINE_RAM_GB=${MACHINE_RAM_GB:-}
      - MACHINE_CPU_CORES=${MACHINE_CPU_CORES:-}
      - COLLECTOR_HEALTH_URL=http://otel-collector:13133
      - AUTH_MODE=jwt
      - AUTH_SECRET=${AUTH_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
    depends_on:
      clickhouse:
        condition: service_healthy
    mem_limit: ${APP_MEM_LIMIT:-768m}
    memswap_limit: ${APP_MEMSWAP_LIMIT:-768m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  clickhouse:
    image: ghcr.io/evoluzione/opendashly-clickhouse:latest
    container_name: opendashly-clickhouse
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_TCP_PORT:-9000}:9000"
    environment:
      - CLICKHOUSE_DB=telemetry
      - CLICKHOUSE_USER=otel
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "otel", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 60s
    mem_limit: ${CLICKHOUSE_MEM_LIMIT:-1536m}
    memswap_limit: ${CLICKHOUSE_MEMSWAP_LIMIT:-1536m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  otel-collector:
    image: ghcr.io/evoluzione/opendashly-otel-collector:latest
    container_name: opendashly-otel-collector
    command: ["--config=/etc/otelcol/config.yaml"]
    ports:
      - "4317:4317"
      - "4318:4318"
      - "13133:13133"
    environment:
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD}
      - MACHINE_PROFILE=${MACHINE_PROFILE:-}
      - MACHINE_RAM_GB=${MACHINE_RAM_GB:-}
      - MACHINE_CPU_CORES=${MACHINE_CPU_CORES:-}
      - OTEL_FILE_STORAGE_DIR=${OTEL_FILE_STORAGE_DIR:-/var/lib/otelcol/queue}
    depends_on:
      clickhouse:
        condition: service_healthy
    user: "0:0"
    volumes:
      - otelcol_queue_data:/var/lib/otelcol
    mem_limit: ${OTEL_COLLECTOR_MEM_LIMIT:-512m}
    memswap_limit: ${OTEL_COLLECTOR_MEMSWAP_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

volumes:
  clickhouse_data:
  otelcol_queue_data:
