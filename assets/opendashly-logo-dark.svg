<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
  <title id="title">OpenDashly Logo</title>
  <desc id="desc">OpenDashly wordmark with layered telemetry icon for dark backgrounds.</desc>
  <defs>
    <linearGradient id="od-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B7CFF"/>
      <stop offset="100%" stop-color="#2DE2D4"/>
    </linearGradient>
  </defs>

  <g transform="translate(312 28)">
    <rect x="0" y="0" width="136" height="136" rx="28" fill="#0F172A" stroke="#475569" stroke-width="2"/>
    <g transform="translate(28 28)" fill="none" stroke="url(#od-gradient)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 0 L0 20 L40 40 L80 20 Z"/>
      <path d="M0 60 L40 80 L80 60"/>
      <path d="M0 40 L40 60 L80 40"/>
    </g>
  </g>

  <g transform="translate(0 0)">
    <text x="380" y="216" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" letter-spacing="0.5">OpenDashly</text>
    <text x="380" y="244" text-anchor="middle" fill="#CBD5E1" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1.2">OBSERVABILITY DASHBOARD</text>
  </g>
</svg>
