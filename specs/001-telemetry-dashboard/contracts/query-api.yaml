openapi: 3.0.3
info:
  title: Telemetry Query API
  version: 1.0.0
servers:
  - url: https://api.example.com
security:
  - bearerAuth: []
paths:
  /api/query/run:
    post:
      summary: Run an ad-hoc telemetry query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRunResult'
  /api/queries:
    get:
      summary: List saved queries
      responses:
        '200':
          description: Saved queries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQueryList'
    post:
      summary: Save a query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedQueryCreate'
      responses:
        '201':
          description: Saved query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
  /api/queries/{queryId}:
    get:
      summary: Get saved query
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Saved query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedQuery'
    delete:
      summary: Delete saved query
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /api/queries/{queryId}/run:
    post:
      summary: Run a saved query
      parameters:
        - name: queryId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueryRunResult'
  /api/traces/{traceId}/related:
    get:
      summary: Get logs and metrics related to a trace
      parameters:
        - name: traceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Related telemetry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RelatedTelemetry'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    QueryRequest:
      type: object
      required: [signals, timeRange]
      properties:
        signals:
          type: array
          items:
            type: string
            enum: [logs, traces, metrics]
        timeRange:
          type: object
          required: [from, to]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        filters:
          type: object
          additionalProperties:
            type: string
        limit:
          type: integer
          minimum: 1
          maximum: 10000
        orderBy:
          type: string
          enum: [timestamp_desc, timestamp_asc]
    SavedQueryCreate:
      type: object
      required: [name, request]
      properties:
        name:
          type: string
        description:
          type: string
        request:
          $ref: '#/components/schemas/QueryRequest'
    SavedQuery:
      type: object
      required: [id, name, request, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        request:
          $ref: '#/components/schemas/QueryRequest'
        createdAt:
          type: string
          format: date-time
    SavedQueryList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SavedQuery'
    QueryRunResult:
      type: object
      required: [runId, status, results]
      properties:
        runId:
          type: string
        status:
          type: string
          enum: [complete, failed]
        summary:
          type: object
          properties:
            logCount:
              type: integer
            traceCount:
              type: integer
            metricCount:
              type: integer
        results:
          type: object
          properties:
            logs:
              type: array
              items:
                $ref: '#/components/schemas/LogEntry'
            traces:
              type: array
              items:
                $ref: '#/components/schemas/TraceSpan'
            metrics:
              type: array
              items:
                $ref: '#/components/schemas/MetricSeries'
    LogEntry:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        severity:
          type: string
        body:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        traceId:
          type: string
        spanId:
          type: string
    TraceSpan:
      type: object
      properties:
        traceId:
          type: string
        spanId:
          type: string
        parentSpanId:
          type: string
        name:
          type: string
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        status:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
    MetricSeries:
      type: object
      properties:
        name:
          type: string
        unit:
          type: string
        points:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              value:
                type: number
    RelatedTelemetry:
      type: object
      properties:
        logs:
          type: array
          items:
            $ref: '#/components/schemas/LogEntry'
        metrics:
          type: array
          items:
            $ref: '#/components/schemas/MetricSeries'
