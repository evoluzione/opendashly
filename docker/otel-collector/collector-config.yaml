receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: ${env:OTEL_MEMORY_LIMITER_CHECK_INTERVAL}
    limit_mib: ${env:OTEL_MEMORY_LIMIT_MIB}
    spike_limit_mib: ${env:OTEL_MEMORY_SPIKE_LIMIT_MIB}
  batch:
    send_batch_size: ${env:OTEL_BATCH_SEND_SIZE}
    timeout: ${env:OTEL_BATCH_TIMEOUT}

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: telemetry
    timeout: ${env:OTEL_EXPORTER_TIMEOUT}
    username: otel
    password: ${env:CLICKHOUSE_PASSWORD}
    sending_queue:
      enabled: true
      queue_size: ${env:OTEL_SENDING_QUEUE_SIZE}
      num_consumers: ${env:OTEL_SENDING_QUEUE_CONSUMERS}
      storage: file_storage
      blocking: true
    retry_on_failure:
      enabled: true
      initial_interval: ${env:OTEL_RETRY_INITIAL_INTERVAL}
      max_interval: ${env:OTEL_RETRY_MAX_INTERVAL}
      max_elapsed_time: ${env:OTEL_RETRY_MAX_ELAPSED_TIME}

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: ${env:OTEL_FILE_STORAGE_DIR}
    create_directory: true

service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
