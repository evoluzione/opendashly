receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: __MEMORY_LIMITER_CHECK_INTERVAL__
    limit_mib: __MEMORY_LIMIT_MIB__
    spike_limit_mib: __MEMORY_SPIKE_LIMIT_MIB__
  batch:
    send_batch_size: __BATCH_SEND_SIZE__
    timeout: __BATCH_TIMEOUT__

exporters:
  clickhouse:
    endpoint: tcp://clickhouse:9000
    database: telemetry
    timeout: __EXPORTER_TIMEOUT__
    username: otel
    password: ${env:CLICKHOUSE_PASSWORD}
    sending_queue:
      enabled: true
      queue_size: __SENDING_QUEUE_SIZE__
      num_consumers: __SENDING_QUEUE_CONSUMERS__
      storage: file_storage
      # Never block the pipeline on a full queue: with blocking=true a broken
      # ClickHouse backs the whole collector up until it wedges (health
      # endpoint included). Dropping the overflow keeps the collector alive;
      # the file-backed queue still preserves what fits across restarts.
      blocking: false
    retry_on_failure:
      enabled: true
      initial_interval: __RETRY_INITIAL_INTERVAL__
      max_interval: __RETRY_MAX_INTERVAL__
      max_elapsed_time: __RETRY_MAX_ELAPSED_TIME__

extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  file_storage:
    directory: __FILE_STORAGE_DIR__
    create_directory: true

service:
  extensions: [health_check, file_storage]
  telemetry:
    logs:
      level: warn
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [clickhouse]
